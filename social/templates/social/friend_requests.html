{% extends "base.html" %} {% load i18n %} {% block content %}
<div class="container mt-4">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card shadow-sm">
        <div class="card-header bg-warning">
          <h4 class="mb-0">{% trans "طلبات الصداقة" %}</h4>
        </div>
        <div class="card-body">
          {% if pending_requests %}
          <div class="list-group">
            {% for request in pending_requests %}
            <div class="list-group-item">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <strong>{{ request.from_user.username }}</strong>
                </div>
                <div>
                  <button
                    class="btn btn-sm btn-success accept-request"
                    data-request-id="{{ request.id }}"
                  >
                    {% trans "قبول" %}
                  </button>
                  <button
                    class="btn btn-sm btn-danger reject-request"
                    data-request-id="{{ request.id }}"
                  >
                    {% trans "رفض" %}
                  </button>
                </div>
              </div>
            </div>
            {% endfor %}
          </div>
          {% else %}
          <div class="text-center py-4">
            <p class="text-muted">{% trans "لا توجد طلبات صداقة" %}</p>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === name + "=") {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  document.querySelectorAll(".accept-request").forEach((button) => {
    button.addEventListener("click", function () {
      const requestId = this.dataset.requestId;
      fetch(`/social/accept-request/${requestId}/`, {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
        },
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            location.reload();
          }
        });
    });
  });

  document.querySelectorAll(".reject-request").forEach((button) => {
    button.addEventListener("click", function () {
      const requestId = this.dataset.requestId;
      fetch(`/social/reject-request/${requestId}/`, {
        method: "POST",
        headers: {
          "X-CSRFToken": getCookie("csrftoken"),
        },
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            location.reload();
          }
        });
    });
  });
</script>
{% endblock %}
